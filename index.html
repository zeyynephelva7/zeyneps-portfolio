<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeynep's Portfolio 2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="page cover" id="cover">
    <div class="cover-box">
      <div class="cover-bg"></div>
      <div class="lid"></div>
      <h1 class="cover-title">Zeynep's Portfolio</h1>
      <button class="cover-btn" id="coverBtn" type="button"></button>
    </div>
  </section>

  <section class="page about" id="about">
    <h2 class="letters">
      <span style="--r:-5deg;--c:#ef6aa3;--b:#f7e8b7;">A</span>
      <span style="--r:4deg;--c:#8d5e2a;--b:#fffaf4;">B</span>
      <span style="--r:-2deg;--c:#ef4f92;--b:#d8ef93;">O</span>
      <span style="--r:6deg;--c:#793c35;--b:#fffaf4;">U</span>
      <span style="--r:-4deg;--c:#ff6b5f;--b:#ffc9bd;">T</span>
      <span style="--r:2deg;--c:#ff3f93;--b:#f7e8b7;">M</span>
      <span style="--r:-3deg;--c:#27394a;--b:#f6bdd3;">E</span>
    </h2>

    <div class="camera">
      <div class="camera-img">
        <div class="screen"></div>
        <button class="snap" id="snapBtn" type="button"></button>
      </div>
    </div>
  </section>

  <section class="page blank-page" id="blankPage"></section>

  <script src="app.js"></script>
</body>
</html>
